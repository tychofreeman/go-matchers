name: Test

# Changes to Markdown alone do not run the tests.
on:
  pull_request:
    paths:
      - "**"
      - "!**.md"
  push:
    branches: [master]
    paths:
      - "**"
      - "!**.md"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Go ${{ matrix.go }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The minimum version in go.mod and the newest release.
        go: ["1.18.x", "stable"]
    env:
      # Use exactly the Go version from the matrix, not one go.mod asks for.
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          # There is no go.sum: the module has no dependencies.
          cache: false

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...
